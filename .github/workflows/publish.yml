name: Publish

# Publishes to npm, run from main with the version tag:
#   gh workflow run publish.yml -f tag=v0.5.0
# The pipeline is jflowers/ship's shared npm-release.yml: org-infra's
# preflight (semver, tag uniqueness, CI on HEAD, unreleased commits) creates
# the tag, then the tag is checked out, package.json's version must equal
# it, the checks below run, the package is published with provenance (a
# personal-account package isn't staged), and the GitHub release is created
# with generated notes. A version already on npm is skipped, so a re-run is
# safe.
#
# Auth: npm trusted publishing (OIDC), no token. npm checks the calling
# workflow, so npmjs.com trusts this repository and this file (publish.yml),
# not ship's. Renaming this file breaks publishing until the trusted
# publisher on npmjs.com is updated to match.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; package.json's version must match (e.g. v0.5.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/npm-release.yml@bcd5ebc6d1f5ebe209f6701741acea9b6e8bb008 # v0.5.0
    with:
      tag: ${{ inputs.tag }}
      ci_checks: '["typecheck and test"]'
      node_version: "22"
      bun_version: 1.4.4
      # Also builds dist/ through the prepare script; scripts don't run at
      # publish, so this build is what ships.
      install: bun install --frozen-lockfile
      checks: |
        bun run typecheck
        bun test
        bun run verify:package
    permissions:
      contents: write
      checks: read
      id-token: write
